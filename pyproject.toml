[project]
name = "sift"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.2.0",
    "arxiv>=4.0.1",
    "fastapi>=0.141.1",
    "numpy>=2.4.6",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.0",
    "sqlalchemy>=2.0.52",
    "torch>=2.13.0",
    "transformers>=5.16.1",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
